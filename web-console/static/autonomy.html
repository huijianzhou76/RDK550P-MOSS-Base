<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MOSS 自主决策中枢</title>
<style>
:root{--bg:#050607;--panel:#0f1214;--panel2:#14181b;--line:#2b3238;--text:#eef2f4;--muted:#8d98a1;--red:#d44c4c;--green:#4ebb78;--amber:#d7a94b;--blue:#618fc4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#22272b,#080a0b 40%,#050607 75%);color:var(--text);font-family:Inter,"Microsoft YaHei",system-ui,sans-serif}.wrap{max-width:1440px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.top h1{font-size:20px;letter-spacing:.16em;margin:4px 0}.eyebrow{font:10px ui-monospace,monospace;color:var(--muted);letter-spacing:.14em}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.badge{border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:10px;color:var(--muted);background:#0b0d0f}.panel{background:rgba(15,18,20,.94);border:1px solid var(--line);border-radius:16px}.grid{display:grid;grid-template-columns:minmax(280px,.65fr) minmax(0,1.35fr);gap:12px}.left,.right{display:grid;gap:12px;align-content:start}.pad{padding:14px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.head h2{font-size:13px;margin:0}.form{display:grid;gap:8px}.input,.select,.textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#080a0b;color:var(--text);padding:11px 12px;outline:none}.textarea{min-height:105px;resize:vertical}.btn{border:1px solid var(--line);border-radius:10px;background:#171b1e;color:var(--text);padding:10px 12px;cursor:pointer}.btn.primary{border-color:#783838;background:#351718}.btn.approve{border-color:#2c6a45;background:#10261a}.btn.reject{border-color:#743535;background:#2b1515}.btn:disabled{opacity:.4;cursor:not-allowed}.mission-list{display:grid;gap:7px;max-height:510px;overflow:auto}.mission{border:1px solid var(--line);border-radius:11px;background:#0a0d0f;padding:11px;cursor:pointer}.mission.active{border-color:#764242;background:#171012}.mission-title{font-size:12px;font-weight:650}.meta{font:9px ui-monospace,monospace;color:var(--muted);margin-top:5px}.risk{font-size:9px;border:1px solid var(--line);border-radius:999px;padding:4px 7px}.risk.low{color:var(--green)}.risk.medium{color:var(--amber)}.risk.high,.risk.critical{color:#f07c7c}.detail-empty{min-height:390px;display:grid;place-items:center;color:var(--muted);font-size:12px}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.metric{border:1px solid var(--line);background:#0a0d0f;border-radius:11px;padding:11px}.metric small{display:block;font-size:9px;color:var(--muted)}.metric strong{display:block;font:15px ui-monospace,monospace;margin-top:6px}.plan{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:8px;overflow-x:auto}.step{border:1px solid var(--line);border-radius:12px;padding:11px;background:#0a0d0f;min-height:105px}.step-role{font:9px ui-monospace,monospace;color:var(--muted);text-transform:uppercase}.step b{font-size:11px;display:block;margin-top:7px}.step p{font-size:10px;color:var(--muted);line-height:1.5;margin:7px 0 0}.approval{border:1px solid #6d4b2b;background:#1d160d;border-radius:12px;padding:12px}.approval.hidden{display:none}.evidence{display:grid;gap:7px;max-height:330px;overflow:auto}.ev{border-left:2px solid #49535c;padding:7px 9px;background:#090b0d}.ev-kind{font:10px ui-monospace,monospace}.ev-meta{font:9px ui-monospace,monospace;color:var(--muted);margin-top:4px}.ev-body{font-size:10px;color:#b7c0c7;line-height:1.5;margin-top:5px;white-space:pre-wrap;word-break:break-word}.trace{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.role{border:1px solid var(--line);border-radius:12px;padding:12px;background:#0a0d0f}.role h3{font-size:11px;margin:0}.role p{font-size:10px;color:var(--muted);line-height:1.55;min-height:47px}.statusline{font:9px ui-monospace,monospace;color:var(--muted)}.log{height:160px;overflow:auto;background:#07090a;border:1px solid var(--line);border-radius:10px;padding:10px;font:9px/1.55 ui-monospace,monospace;color:#99a4ad}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block}.toast{position:fixed;right:18px;bottom:18px;border:1px solid var(--line);background:#171b1e;border-radius:10px;padding:10px 12px;font-size:10px;opacity:0;transform:translateY(8px);transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:900px){.grid{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}.trace{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}@media(max-width:520px){.summary{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div><div class="eyebrow">550W / AUTONOMY CONTROL PLANE / RISK-GATED</div><h1>MOSS 自主决策中枢</h1></div><div class="row"><a class="btn" href="/">返回中央控制台</a><span class="badge"><span class="dot"></span> <span id="linkState">连接中</span></span><span class="badge" id="modeBadge">MODE -</span><span class="badge" id="versionBadge">API -</span></div></header>

  <div class="grid">
    <aside class="left">
      <section class="panel pad">
        <div class="head"><h2>创建自主任务</h2><span class="badge">PLAN → EXECUTE → VERIFY</span></div>
        <form id="missionForm" class="form">
          <input class="input" id="title" placeholder="任务名称，例如：检查系统健康状态" maxlength="120" />
          <textarea class="textarea" id="prompt" placeholder="描述 MOSS 要完成的目标、约束和交付结果" required></textarea>
          <div class="row"><select class="select" id="priority" style="flex:1"><option value="normal">Normal</option><option value="high">High</option><option value="critical">Critical</option><option value="low">Low</option></select><button class="btn primary" type="submit">创建并运行</button></div>
        </form>
      </section>
      <section class="panel pad"><div class="head"><h2>Mission Queue</h2><button class="btn" id="refreshBtn">刷新</button></div><div class="mission-list" id="missionList"><div class="statusline">正在读取任务...</div></div></section>
      <section class="panel pad"><div class="head"><h2>实时事件</h2><span class="badge" id="heartbeatBadge">HEARTBEAT -</span></div><div class="log" id="eventLog"></div></section>
    </aside>

    <main class="right">
      <section class="panel pad" id="detailPanel"><div class="detail-empty">选择左侧任务查看 MOSS 的决策过程</div></section>
    </main>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);let currentId=null;let missions=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
function log(t){const d=document.createElement('div');d.textContent='['+new Date().toLocaleTimeString()+'] '+t;$('#eventLog').appendChild(d);$('#eventLog').scrollTop=$('#eventLog').scrollHeight}
async function api(url,opt){const r=await fetch(url,opt);let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(typeof j.detail==='string'?j.detail:(j.detail?.message||j.error||r.statusText));return j}
function riskClass(r){return ['low','medium','high','critical'].includes(r)?r:'low'}
function renderList(){const box=$('#missionList');if(!missions.length){box.innerHTML='<div class="statusline">暂无任务</div>';return}box.innerHTML=missions.map(m=>{const risk=m.risk?.level||'low';return `<div class="mission ${m.id===currentId?'active':''}" data-id="${m.id}"><div class="row" style="justify-content:space-between"><div class="mission-title">${esc(m.title)}</div><span class="risk ${riskClass(risk)}">${esc(risk.toUpperCase())}</span></div><div class="meta">${esc(m.status)} · ${esc(m.stage||'-')} · ${Number(m.progress||0)}%</div></div>`}).join('');box.querySelectorAll('.mission').forEach(x=>x.onclick=()=>selectMission(x.dataset.id))}
async function refresh(){const j=await api('/api/missions');missions=j.missions||[];renderList();if(currentId)await selectMission(currentId,false)}
function planHtml(plan=[]){return `<div class="plan">${plan.map(s=>`<div class="step"><div class="step-role">${esc(s.role)}</div><b>${esc(s.title)}</b><p>${esc(s.description)}</p></div>`).join('')}</div>`}
function evidenceHtml(rows=[]){if(!rows.length)return '<div class="statusline">暂无证据</div>';return `<div class="evidence">${rows.slice().reverse().map(e=>`<div class="ev"><div class="ev-kind">${esc(e.kind)}</div><div class="ev-meta">${esc(e.actor)} · ${new Date(e.ts).toLocaleString()} · SHA ${esc(String(e.sha256||'').slice(0,12))}</div><div class="ev-body">${esc(JSON.stringify(e.payload||{},null,2)).slice(0,1800)}</div></div>`).join('')}</div>`}
async function selectMission(id,relist=true){currentId=id;if(relist)renderList();let j;try{j=await api('/api/missions/'+id)}catch(e){toast(e.message);return}const m=j.mission;const risk=m.risk||{level:'low',score:15,approval_required:false};const approvalNeeded=m.status==='awaiting_approval';const verification=m.verification||'尚未进入验证阶段';$('#detailPanel').innerHTML=`
<div class="head"><div><div class="eyebrow">MISSION ${esc(m.id)}</div><h2 style="font-size:17px;margin:5px 0">${esc(m.title)}</h2></div><div class="row"><span class="risk ${riskClass(risk.level)}">RISK ${esc(String(risk.level).toUpperCase())} / ${Number(risk.score||0)}</span><span class="badge">${esc(m.status)}</span></div></div>
<div class="summary"><div class="metric"><small>PROGRESS</small><strong>${Number(m.progress||0)}%</strong></div><div class="metric"><small>STAGE</small><strong>${esc(m.stage||'-')}</strong></div><div class="metric"><small>PRIORITY</small><strong>${esc(m.priority)}</strong></div><div class="metric"><small>VERIFICATION</small><strong>${m.verification_passed===true?'PASS':m.verification_passed===false?'REVIEW':'-'}</strong></div></div>
<div style="margin-top:12px"><div class="head"><h2>决策计划树</h2><span class="badge">5 STAGES</span></div>${planHtml(m.plan||[])}</div>
<div class="approval ${approvalNeeded?'':'hidden'}" style="margin-top:12px"><div class="head"><div><div class="eyebrow">HUMAN-IN-THE-LOOP</div><h2>该任务需要人工授权</h2></div><span class="risk ${riskClass(risk.level)}">${esc(risk.level.toUpperCase())}</span></div><div class="statusline" style="line-height:1.6;margin-bottom:9px">本地策略引擎阻止 MOSS 在未批准时启动执行角色。批准后会继续 Planner → Operator → Verifier。</div><div class="row"><button class="btn approve" id="approveBtn">批准执行</button><button class="btn reject" id="rejectBtn">拒绝任务</button></div></div>
<div style="margin-top:12px"><div class="head"><h2>三角色 Agent 轨迹</h2><span class="badge">ISOLATED SESSIONS</span></div><div class="trace"><div class="role"><h3>PLANNER / 规划者</h3><p>只负责目标拆解、约束和成功标准，不直接执行工具。</p><div class="statusline">session: ${esc(m.sessions?.planner||'pending')}</div></div><div class="role"><h3>OPERATOR / 执行者</h3><p>依据规划执行任务；如果需要新权限，应停止而不是越权。</p><div class="statusline">session: ${esc(m.sessions?.operator||'pending')}</div></div><div class="role"><h3>VERIFIER / 验证者</h3><p>独立检查任务是否满足要求、是否越权以及结果能否验证。</p><div class="statusline">session: ${esc(m.sessions?.verifier||'pending')}</div></div></div></div>
<div class="panel" style="margin-top:12px;background:#0a0d0f"><div class="pad"><div class="head"><h2>验证结论</h2><span class="badge">${m.verification_passed===true?'PASS':m.verification_passed===false?'REVIEW':'PENDING'}</span></div><div style="font-size:11px;color:var(--muted);white-space:pre-wrap;line-height:1.7">${esc(verification)}</div></div></div>
<div style="margin-top:12px"><div class="head"><h2>Evidence Chain</h2><span class="badge">SHA-256 AUDIT</span></div>${evidenceHtml(j.evidence||[])}</div>`;
if(approvalNeeded){$('#approveBtn').onclick=()=>approve('approve');$('#rejectBtn').onclick=()=>approve('reject')}
}
async function approve(decision){try{await api('/api/missions/'+currentId+'/approval',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision,note:decision==='approve'?'Web operator approved':'Web operator rejected'})});toast(decision==='approve'?'任务已批准':'任务已拒绝');await refresh()}catch(e){toast(e.message)}}
$('#missionForm').onsubmit=async e=>{e.preventDefault();const prompt=$('#prompt').value.trim();if(!prompt)return;try{const j=await api('/api/missions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:$('#title').value.trim(),prompt,priority:$('#priority').value,auto_run:true})});currentId=j.mission.id;$('#prompt').value='';toast('Mission 已创建');setTimeout(refresh,200)}catch(e){toast(e.message)}};$('#refreshBtn').onclick=refresh;
(async()=>{try{const h=await api('/api/health');$('#modeBadge').textContent='MODE '+h.state.mode;$('#versionBadge').textContent='API '+h.version}catch(e){log('health error '+e.message)}await refresh()})();
const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');ws.onopen=()=>{$('#linkState').textContent='实时连接';log('websocket online')};ws.onclose=()=>{$('#linkState').textContent='连接断开';log('websocket offline')};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.event==='heartbeat.tick'){$('#heartbeatBadge').textContent='HEARTBEAT '+(m.payload.alerts?.length?'ALERT '+m.payload.alerts.length:'NOMINAL')}if(m.event!=='system.state')log(m.event);if(m.event.startsWith('mission.')){refresh()}};
</script>
</body>
</html>
