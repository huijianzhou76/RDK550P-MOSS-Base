name: MOSS Hardware V1 CI

on:
  push:
    branches:
      - feature/hardware-v1
    paths:
      - "moss-hardware/**"
      - "moss-mcu/**"
      - "web-console/app_mcu.py"
      - "web-console/mcu_service.py"
      - "systemd/moss-web-console.service"
      - "setup/install_web_console.sh"
      - "docs/HARDWARE_*.md"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/hardware-v1-ci.yml"
  pull_request:
    paths:
      - "moss-hardware/**"
      - "moss-mcu/**"
      - "web-console/app_mcu.py"
      - "web-console/mcu_service.py"
      - "systemd/moss-web-console.service"
      - "setup/install_web_console.sh"
      - "docs/HARDWARE_*.md"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/hardware-v1-ci.yml"

jobs:
  gateway-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile hardware Python
        run: |
          python -m py_compile \
            moss-hardware/python/moss_hardware/__init__.py \
            moss-hardware/python/moss_hardware/gateway.py \
            moss-hardware/python/moss_hardware/cli.py \
            web-console/mcu_service.py \
            web-console/app_mcu.py
      - name: Run gateway protocol tests
        run: python -m unittest discover -s moss-hardware/python/tests -v

  firmware-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check ESP-IDF project structure and safety primitives
        run: |
          test -f moss-mcu/esp32/CMakeLists.txt
          test -f moss-mcu/esp32/main/CMakeLists.txt
          test -f moss-mcu/esp32/main/Kconfig.projbuild
          test -f moss-mcu/esp32/main/main.cpp
          test -f moss-mcu/esp32/main/motion_controller.cpp
          test -f moss-mcu/esp32/main/peripherals.cpp
          test -f moss-mcu/esp32/main/ir_service.cpp
          grep -q 'system.capabilities' moss-mcu/esp32/main/main.cpp
          grep -q 'system.estop' moss-mcu/esp32/main/main.cpp
          grep -q 'head.move' moss-mcu/esp32/main/main.cpp
          grep -q 'set_servo_power(false)' moss-mcu/esp32/main/main.cpp
          grep -q 'WATCHDOG' moss-mcu/esp32/main/Kconfig.projbuild
          grep -q 'IR_CARRIER_HZ = 38000' moss-mcu/esp32/main/ir_service.cpp
          grep -q 'app_mcu.py' systemd/moss-web-console.service

  firmware-build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.4
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3 firmware
        working-directory: moss-mcu/esp32
        run: |
          idf.py set-target esp32s3
          idf.py build
